version: 2
updates:
- package-ecosystem: npm
  directory: /cloudflare/probe
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: nix
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
- package-ecosystem: docker-compose
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
